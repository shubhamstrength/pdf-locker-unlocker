name: Mac app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" scripts/build-app.sh
          cd build && ditto -c -k --keepParent "PDF Locker.app" PDF-Locker-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Locker-mac
          path: mac/build/PDF-Locker-mac.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Works both for a tag pushed from git and for a release drafted on github.com (which creates the tag).
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/PDF-Locker-mac.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/PDF-Locker-mac.zip --title "PDF Locker $GITHUB_REF_NAME" --generate-notes
          fi
